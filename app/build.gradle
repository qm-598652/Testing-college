plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omnimodder.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.omnimodder.studio"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0-PRO"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1,DEPENDENCIES,LICENSE*,NOTICE*}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Official Google APK Signer (V1 + V2 + V3 signing directly on phone)
    implementation 'com.android.tools.build:apksig:8.3.2'
    // BouncyCastle for RSA-2048 X.509 key generation & Original Cert SHA-1 extraction
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
}
