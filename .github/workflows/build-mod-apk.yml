name: Build OmniModder Studio Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-modder-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 34 (Direct Native Fix)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build OmniModder Studio APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare Output APK
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/OmniModder-Studio-v2.0.apk

      - name: Upload OmniModder Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniModder-Studio-APK
          path: release_apk/OmniModder-Studio-v2.0.apk
          if-no-files-found: error
