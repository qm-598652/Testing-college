name: APK Modder & Signer Factory

on:
  push:
    paths:
      - 'uploads/*.apk'
      - 'input.apk'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to download APK (leave blank if you uploaded an APK from Gallery into uploads/)'
        required: false
        default: ''
      patch_ads:
        description: 'Remove Ads (AdMob, Unity, AppLovin, IronSource, Facebook, Vungle, Mintegral, Pangle)'
        type: boolean
        default: true
      patch_popups:
        description: 'Kill Dialogs, Force-Update & Rate Pop-ups'
        type: boolean
        default: true
      patch_screenshot:
        description: 'Remove FLAG_SECURE (Enable Screenshots & Screen Recording)'
        type: boolean
        default: true
      patch_ssl:
        description: 'Make APK Capturable (Bypass SSL Pinning, Trust User CAs, Hide VPN/Proxy)'
        type: boolean
        default: true
      patch_billing:
        description: 'Unlock Pro/Premium Booleans & Bypass Root/Emulator/Tamper Checks'
        type: boolean
        default: true
      remove_tabs:
        description: 'Comma-separated tab/button IDs to remove (e.g. tab_shop,nav_ads,btn_vip)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  patch-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Apktool v2.9.3 & Uber-APK-Signer v1.3.0 (Official GitHub Mirrors)
        run: |
          mkdir -p tools
          curl -sSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o tools/apktool
          curl -sSL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o tools/apktool.jar
          chmod +x tools/apktool tools/apktool.jar
          curl -sSL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o tools/uber-apk-signer.jar

      - name: Locate Target APK (URL, Gallery Upload Folder, or Root)
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            echo "[*] Downloading APK from direct URL..."
            curl -sSL -A "Mozilla/5.0 (Linux; Android 14)" "${{ github.event.inputs.apk_url }}" -o target.apk
          elif ls uploads/*.apk 1> /dev/null 2>&1; then
            LATEST_UPLOAD=$(ls -t uploads/*.apk | head -n 1)
            echo "[*] Found Gallery Uploaded APK: $LATEST_UPLOAD"
            cp "$LATEST_UPLOAD" target.apk
          elif [ -f "input.apk" ]; then
            echo "[*] Found root input.apk"
            cp input.apk target.apk
          else
            echo "[!] Error: No APK found! Upload an APK from your gallery to uploads/ or provide apk_url."
            exit 1
          fi
          file target.apk

      - name: Decompile APK with Apktool
        run: |
          ./tools/apktool d target.apk -o decompiled_apk -f

      - name: Run 100+ Feature Smali & Resource Patcher
        run: |
          python3 patcher.py \
            --dir decompiled_apk \
            --ads "${{ github.event.inputs.patch_ads || 'true' }}" \
            --popups "${{ github.event.inputs.patch_popups || 'true' }}" \
            --screenshot "${{ github.event.inputs.patch_screenshot || 'true' }}" \
            --ssl "${{ github.event.inputs.patch_ssl || 'true' }}" \
            --billing "${{ github.event.inputs.patch_billing || 'true' }}" \
            --tabs "${{ github.event.inputs.remove_tabs || '' }}" \
            --rules patches/custom_rules.json

      - name: Rebuild Patched APK (AAPT2 with Fallback)
        run: |
          if ! ./tools/apktool b decompiled_apk -o unsigned_mod.apk --use-aapt2; then
            echo "[!] AAPT2 strict check triggered, retrying rebuild with standard mode..."
            ./tools/apktool b decompiled_apk -o unsigned_mod.apk
          fi

      - name: Zipalign & Sign APK (v1 + v2 + v3 Signatures)
        run: |
          java -jar tools/uber-apk-signer.jar --apks unsigned_mod.apk --out signed_output

      - name: Upload Modded & Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modded-Signed-APK
          path: signed_output/*-aligned-debugSigned.apk
          if-no-files-found: error
