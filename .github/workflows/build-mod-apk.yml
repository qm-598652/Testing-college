name: Build OmniModder Studio Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-modder-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Full Android Project via Python
        run: python3 setup_project.py

      - name: Install Android SDK 34 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile OmniModder Studio APK
        run: |
          gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --no-daemon --stacktrace
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/OmniModder-Studio-v4.0.apk
          ls -lh release_apk/OmniModder-Studio-v4.0.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging release_apk/OmniModder-Studio-v4.0.apk | grep -E "package:|launchable-activity:"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniModder-Studio-v4.0-APK
          path: release_apk/OmniModder-Studio-v4.0.apk
          if-no-files-found: error

      - name: Also Save APK Directly Into Repo (release_apk/ folder)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f release_apk/OmniModder-Studio-v4.0.apk
          git commit -m "Auto-publish compiled OmniModder-Studio-v4.0.apk" || true
          git push || true
