<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APK Modder & Signer Factory — Gallery Uploader</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 540px; background: var(--card); padding: 20px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: var(--accent); font-size: 1.35rem; }
    label { display: block; margin-top: 12px; font-size: 0.88rem; color: var(--muted); }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%; padding: 10px 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: var(--text); font-size: 0.95rem;
    }
    .toggles { margin-top: 14px; display: grid; gap: 8px; }
    .toggle-row { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    .toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }
    button {
      width: 100%; margin-top: 18px; padding: 13px; border: none; border-radius: 8px;
      background: var(--accent); color: #052e16; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 14px; padding: 10px; border-radius: 8px; background: #0f172a; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚡ APK Modder Factory</h2>

    <label>GitHub Repository (username/repo)</label>
    <input type="text" id="repo" placeholder="e.g. lewis/apk-patcher-factory" />

    <label>GitHub Personal Access Token (repo + workflow scope)</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />

    <label>Option A: Pick Target APK from Phone Gallery / Files</label>
    <input type="file" id="apkFile" accept=".apk,application/vnd.android.package-archive" />

    <label>Option B: Or Paste Direct APK Download Link</label>
    <input type="text" id="apkUrl" placeholder="https://example.com/app.apk" />

    <label>Remove Specific Tab / Button IDs (comma-separated)</label>
    <input type="text" id="removeTabs" placeholder="tab_shop, nav_ads, btn_vip" />

    <div class="toggles">
      <label class="toggle-row"><input type="checkbox" id="ads" checked /> Remove All Ads (15+ Ad SDKs + Banners)</label>
      <label class="toggle-row"><input type="checkbox" id="popups" checked /> Remove Dialogs, Rate & Force-Update Pop-ups</label>
      <label class="toggle-row"><input type="checkbox" id="screenshot" checked /> Remove FLAG_SECURE (Allow Screenshot/Record)</label>
      <label class="toggle-row"><input type="checkbox" id="ssl" checked /> Make APK Capturable (SSL Unpin + Hide VPN)</label>
      <label class="toggle-row"><input type="checkbox" id="billing" checked /> Unlock Pro Booleans & Defeat Root/Anti-Tamper</label>
    </div>

    <button id="runBtn" onclick="startModPipeline()">🚀 Upload & Build Modded APK</button>
    <div id="status"></div>
  </div>

  <script>
    function log(msg) {
      const box = document.getElementById('status');
      box.style.display = 'block';
      box.textContent += msg + '\n';
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    async function startModPipeline() {
      const repo = document.getElementById('repo').value.trim();
      const token = document.getElementById('token').value.trim();
      const fileInput = document.getElementById('apkFile');
      const apkUrl = document.getElementById('apkUrl').value.trim();
      const btn = document.getElementById('runBtn');

      document.getElementById('status').textContent = '';
      if (!repo || !token) {
        log('[!] Enter both GitHub Repository (owner/repo) and Token.');
        return;
      }

      btn.disabled = true;
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      try {
        // 1. If user selected an APK file from phone gallery/storage, upload it to uploads/target.apk
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          log(`[*] Reading ${file.name} (${(file.size / 1048576).toFixed(2)} MB) from device...`);
          const buffer = await file.arrayBuffer();
          const b64 = arrayBufferToBase64(buffer);

          const uploadPath = `uploads/gallery_upload.apk`;
          log(`[*] Uploading APK to ${repo}/${uploadPath}...`);

          // Check if file already exists to grab its SHA
          let sha = undefined;
          const existing = await fetch(`https://api.github.com/repos/${repo}/contents/${uploadPath}`, { headers });
          if (existing.ok) {
            const data = await existing.json();
            sha = data.sha;
          }

          const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${uploadPath}`, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: `Upload ${file.name} from mobile gallery`,
              content: b64,
              ...(sha ? { sha } : {})
            })
          });

          if (!putRes.ok) {
            throw new Error(`Upload failed (${putRes.status}): ${await putRes.text()}`);
          }
          log('[+] APK uploaded to repository! Dispatching Modder Workflow...');
        }

        // 2. Trigger workflow_dispatch with selected feature flags
        const dispatchRes = await fetch(
          `https://api.github.com/repos/${repo}/actions/workflows/build-mod-apk.yml/dispatches`,
          {
            method: 'POST',
            headers,
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                apk_url: apkUrl,
                patch_ads: String(document.getElementById('ads').checked),
                patch_popups: String(document.getElementById('popups').checked),
                patch_screenshot: String(document.getElementById('screenshot').checked),
                patch_ssl: String(document.getElementById('ssl').checked),
                patch_billing: String(document.getElementById('billing').checked),
                remove_tabs: document.getElementById('removeTabs').value.trim()
              }
            })
          }
        );

        if (!dispatchRes.ok) {
          throw new Error(`Workflow dispatch failed (${dispatchRes.status}): ${await dispatchRes.text()}`);
        }

        log(`[✓] Build started! Open https://github.com/${repo}/actions to download Modded-Signed-APK in ~2 mins.`);
      } catch (err) {
        log(`[ERROR] ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
